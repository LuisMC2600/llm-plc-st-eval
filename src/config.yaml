# =====================================================================
# Configuración del pipeline experimental — Tesis LLMs + PLC (FIE-UTP)
# Tarea 3.3 del plan de trabajo. TODO parámetro experimental vive aquí:
# el código no contiene valores "mágicos" (variable de control).
# =====================================================================

experimento:
  nombre: "eval_llm_plc_st"
  ejecuciones_por_tarea: 3          # múltiples ejecuciones -> consistencia
  # Banco completo: 30 tareas (sin filtro_tareas). 30 x 4 modelos x 2 estrategias
  # x 3 ejecuciones = 720. Ampliacion 2026-09-09: T2 y T4 pasan de n=1 a n=3
  # (C5-C8); T3 y T5 quedan como estudio de caso cualitativo con n=1.
  estrategias: ["zero_shot", "few_shot"]

# Parámetros de generación FIJOS para todos los modelos (variable de control).
# Confirmar valores definitivos en la calibración/dry run (tarea 3.4).
generacion:
  temperature: 0.2
  max_tokens: 2500                  # según presupuesto de la propuesta (respuesta visible)

# Identificadores EXACTOS de modelo — CONGELADOS el 2026-09-09 (riesgo R1).
# Verificado ese dia contra la documentacion de cada proveedor:
#   claude-sonnet-4-20250514 fue RETIRADO el 2026-06-15; su reemplazo oficial
#   es claude-sonnet-4-6, que ademas es el modelo usado en el piloto y en el
#   articulo CITDES, por lo que se conserva la comparabilidad. gpt-4o se fija
#   al snapshot con fecha que la API reporto en el piloto, para que el alias
#   no se desplace a mitad del experimento.
# CAMBIO 2026-10-02 (INC-19, aprobado por Luis con visto bueno de la asesora):
#   gemini-2.5-pro fue retirado por Google para cuentas nuevas (HTTP 404 al
#   generar). Se sustituye por gemini-3.1-pro-preview, el sucesor de gama Pro
#   que indica el propio mensaje de error. Es un modelo "preview": las llamadas
#   de Google se ejecutan en un solo dia y el log guarda la version reportada.
modelos:
  - id: "gpt-4o-2024-08-06"         # snapshot reportado por la API en el piloto
    proveedor: "openai"
  - id: "claude-sonnet-4-6"         # mismo modelo del piloto; activo, retiro no antes de 2027-02-17
    proveedor: "anthropic"
  - id: "gemini-3.1-pro-preview"    # sustituye a gemini-2.5-pro (INC-19, 2026-10-02)
    proveedor: "google"
    # INC-28 (2026-10-03): en Gemini el tope de la API cubre razonamiento +
    # respuesta y el razonamiento no se puede desactivar. generacion.max_tokens
    # (2500) sigue siendo el tope de la RESPUESTA VISIBLE, comun a los 4 modelos;
    # este es el tope total enviado a la API: 2500 de respuesta + 7500 de margen
    # de razonamiento (el doble del maximo medido en la sonda sobre A6: 3787).
    # Regla fijada de antemano: una respuesta que aun asi termine en MAX_TOKENS
    # se reporta como truncada y no se repite.
    max_tokens_total: 10000
  - id: "qwen2.5-coder:14b"         # servido localmente por Ollama
    proveedor: "ollama"

rutas:
  tareas: "tasks.json"
  repositorio: "../data/definitivo"        # repositorio/<modelo>/<tarea>/<estrategia>/ejec_<n>.st
  log: "../data/definitivo/log.jsonl"      # dato primario tabular del estudio

reintentos:
  max_intentos: 4
  espera_base_s: 5                  # backoff exponencial: 5, 10, 20, 40 s
